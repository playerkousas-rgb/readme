name: slim-guard
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json
      - run: npm install --omit=dev 2>/dev/null || npm install
      - name: check (size / dead-assets / deps)
        run: npm run check
      - name: build
        run: npm run build
      - name: verify dist size <5MB
        run: |
          SIZE=$(du -sb dist | cut -f1)
          MAX=$((5*1024*1024))
          echo "dist size: $SIZE bytes (max $MAX)"
          if [ "$SIZE" -gt "$MAX" ]; then echo "::error::dist 超過 5MB 上限"; exit 1; fi
      - name: fail if .vercelignore missing
        run: test -f .vercelignore || (echo "::error::缺少 .vercelignore (最重要)" && exit 1)
